name: Binance Square Auto Reposter

on:

  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"


permissions:
  contents: write


jobs:

  repost:

    runs-on: ubuntu-latest

    timeout-minutes: 5

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Binance Square monitor
        env:
          BINANCE_SQUARE_OPENAPI_KEY: ${{ secrets.BINANCE_SQUARE_OPENAPI_KEY }}
          SOURCE_AUTHOR: TF_bnb
        run: |
          python src/monitor.py

      - name: Save updated state
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add src/state.json

          if git diff --cached --quiet; then
            echo "No state changes."
          else
            git commit -m "Update Square repost state"
            git push
          fi
